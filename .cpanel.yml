---
deployment:
  tasks:
    # Replace CPANELUSER below with your actual cPanel username.
    # Find it in cPanel → top-right, or under "General Information".
    - export DEPLOYPATH=/home/CPANELUSER/public_html

    # Pages
    - /bin/cp -f index.html $DEPLOYPATH
    - /bin/cp -f services.html $DEPLOYPATH
    - /bin/cp -f products.html $DEPLOYPATH
    - /bin/cp -f contact.html $DEPLOYPATH
    - /bin/cp -f free-trial.html $DEPLOYPATH
    - /bin/cp -f checkout.html $DEPLOYPATH
    - /bin/cp -f get-started.html $DEPLOYPATH

    # Client area (PHP)
    - /bin/cp -f signup.php $DEPLOYPATH
    - /bin/cp -f login.php $DEPLOYPATH
    - /bin/cp -f logout.php $DEPLOYPATH
    - /bin/cp -f dashboard.php $DEPLOYPATH
    - /bin/cp -f checkout.php $DEPLOYPATH
    - /bin/cp -f config.example.php $DEPLOYPATH

    # Folders
    - /bin/mkdir -p $DEPLOYPATH/includes $DEPLOYPATH/api $DEPLOYPATH/admin
    - /bin/mkdir -p $DEPLOYPATH/assets/css $DEPLOYPATH/assets/js $DEPLOYPATH/assets/img
    - /bin/cp -f includes/*.php $DEPLOYPATH/includes/
    - /bin/cp -f api/*.php $DEPLOYPATH/api/
    - /bin/cp -f admin/*.php $DEPLOYPATH/admin/
    - /bin/cp -f assets/css/*.css $DEPLOYPATH/assets/css/
    - /bin/cp -f assets/js/*.js $DEPLOYPATH/assets/js/
    - /bin/cp -f assets/img/* $DEPLOYPATH/assets/img/

    # Keep config.php private (it holds your API keys) — it is never
    # copied here, so your live config is safe from every deploy.
    - /bin/chmod 600 $DEPLOYPATH/config.php || true
